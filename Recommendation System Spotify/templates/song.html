<!DOCTYPE html>
<html>
<head>
    <title>{{ song.name }}</title>
</head>
<body>
    <h1>{{ song.name }}</h1>
    <p><strong>Artist:</strong> {{ song.artist }}</p>
    <p><strong>Album:</strong> {{ song.album }}</p>
    <img src="{{ song.image }}" width="300"><br><br>
    <a href="{{ song.url }}" target="_blank">Listen on Spotify</a><br>
    <a href="/">🔙 Back</a>
</body>
</html>
